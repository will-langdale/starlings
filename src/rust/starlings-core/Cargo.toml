[package]
name = "starlings-core"
version = "0.1.0"
edition = "2021"

[dependencies]
roaring = "0.10"
rustc-hash = "2.0"
digest = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.5"
hex = "0.4"
rayon = "1.10"
comfy-table = "7.1"
string-interner = "0.17"
fxhash = "0.2"
lru = "0.12"
dashmap = { version = "6.1", features = ["raw-api"] }
parking_lot = "0.12"
lasso = { version = "0.7", features = ["multi-threaded"] }
once_cell = "1.19"
boxcar = "0.2"
fastrand = "2.0"
sysinfo = "0.32"
libc = "0.2"
thiserror = "1.0"
tempfile = "3.0"
memmap2 = "0.9"
quick_cache = "0.6"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"
fastrand = "2.0"

[[bench]]
name = "record_insertion"
harness = false

[[bench]]
name = "hierarchy_construction"
harness = false

[[bench]]
name = "partition_reconstruction"
harness = false