site_name: "Starlings"
site_description: "Documentation for starlings"
repo_url: "https://github.com/will-langdale/starlings"
repo_name: "will-langdale/starlings"

nav:
- Home: index.md
- Design:
  - Overview: design/overview.md
  - First principles: design/principles.md
  - Foundational constructs: design/algorithms.md
  - Rust engine: design/engine.md
  - Python API: design/interface.md
  - Roadmap: design/roadmap.md
- API reference: 
  - Core: api/index.md
  - Generators: api/generators.md
- Contributing: contributing.md

theme:
  name: material
  logo: assets/starling-logo.png
  favicon: assets/starling-logo.png
  features:
    - content.code.copy
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - smarty
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.blocks.caption
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: list
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            separate_signature: true
            show_bases: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/will-langdale/starlings
  generator: false

extra_css:
  - stylesheets/extra.css